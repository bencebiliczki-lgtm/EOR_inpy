name: Windows build

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4"
          python -m pip install -c constraints-windows-legacy.txt -e ".[dev,ui,hardware,export,package]"
          python -m pip check
          python -c "import numpy; print('Packaged NumPy version:', numpy.__version__); assert numpy.__version__ == '1.26.4'"
      - name: Test
        run: pytest
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm AFKI-EOR.spec
      - name: Verify packaged hardware discovery modules
        shell: pwsh
        run: |
          @'
          from PyInstaller.archive.readers import ZlibArchiveReader

          required = {
              "nidaqmx",
              "nidaqmx.system",
              "serial",
              "serial.tools",
              "serial.tools.list_ports",
              "serial.tools.list_ports_windows",
          }
          packaged = set(ZlibArchiveReader("build/AFKI-EOR/PYZ-00.pyz").toc)
          missing = sorted(required - packaged)
          if missing:
              raise SystemExit(f"Missing packaged hardware modules: {missing}")
          print("Packaged hardware modules verified:", sorted(required))
          '@ | python -
      - name: Create installer package
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          if ([string]::IsNullOrWhiteSpace($refName)) {
            $refName = "${{ github.sha }}"
          }
          $refName = $refName -replace '[^A-Za-z0-9._-]', '-'
          $packageName = "AFKI-EOR-$refName.zip"

          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "dist/AFKI-EOR" -Destination "package/AFKI-EOR" -Recurse
          Set-Content -Path "package/README.txt" -Value "AFKI-EOR Windows build generated by GitHub Actions."
          Compress-Archive -Path "package/*" -DestinationPath $packageName -Force

          "PACKAGE_PATH=$packageName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/upload-artifact@v4
        with:
          name: AFKI-EOR-${{ github.ref_name }}
          path: dist/AFKI-EOR/
      - uses: actions/upload-artifact@v4
        with:
          name: AFKI-EOR-package-${{ github.ref_name }}
          path: ${{ env.PACKAGE_PATH }}
      # Expected GitHub Secrets:
      # SSH_HOST, SSH_USERNAME, SSH_PASSWORD, SSH_PORT (optional)
      # TAILSCALE_CLIENT_ID, TAILSCALE_CLIENT_SECRET
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_CLIENT_SECRET }}
          tags: tag:ci
          ping: ${{ secrets.SSH_HOST }}

      - name: Upload and extract package over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SSH_PORT)) {
            $env:SSH_PORT = "22"
          }

          if (
            [string]::IsNullOrWhiteSpace($env:SSH_HOST) -or
            [string]::IsNullOrWhiteSpace($env:SSH_USERNAME) -or
            [string]::IsNullOrWhiteSpace($env:SSH_PASSWORD)
          ) {
            throw "Hiányzik az SSH_HOST, SSH_USERNAME vagy SSH_PASSWORD secret."
          }

          python -m pip install --quiet paramiko

          @'
          import base64
          import os
          import pathlib
          import posixpath
          import paramiko

          host = os.environ["SSH_HOST"]
          port = int(os.environ.get("SSH_PORT", "22"))
          username = os.environ["SSH_USERNAME"]
          password = os.environ["SSH_PASSWORD"]
          package_path = pathlib.Path(os.environ["PACKAGE_PATH"])
          remote_dir = "C:/Users/eor/Desktop"
          remote_windows_dir = r"C:\Users\eor\Desktop"

          def run_powershell(client, script):
              encoded = base64.b64encode(
                  script.encode("utf-16-le")
              ).decode("ascii")
              command = (
                  "powershell.exe -NoProfile -NonInteractive "
                  f"-EncodedCommand {encoded}"
              )
              _stdin, stdout, stderr = client.exec_command(command)
              exit_code = stdout.channel.recv_exit_status()
              output = stdout.read().decode("utf-8", errors="replace").strip()
              error = stderr.read().decode("utf-8", errors="replace").strip()
              if output:
                  print(output)
              if exit_code != 0:
                  raise RuntimeError(
                      f"Remote PowerShell failed ({exit_code}): {error}"
                  )

          client = paramiko.SSHClient()
          client.set_missing_host_key_policy(paramiko.AutoAddPolicy())

          try:
              client.connect(
                  hostname=host,
                  port=port,
                  username=username,
                  password=password,
                  look_for_keys=False,
                  allow_agent=False,
                  timeout=30,
                  banner_timeout=30,
                  auth_timeout=30,
              )

              transport = client.get_transport()
              if transport is not None:
                  transport.set_keepalive(15)

              cleanup_script = r"""
          $ErrorActionPreference = 'Stop'
          $TargetDir = [System.IO.Path]::GetFullPath('__REMOTE_WINDOWS_DIR__')
          $ExpectedDir = [System.IO.Path]::GetFullPath('C:\Users\eor\Desktop')
          if (-not [System.StringComparer]::OrdinalIgnoreCase.Equals(
              $TargetDir.TrimEnd('\'),
              $ExpectedDir.TrimEnd('\')
          )) {
              throw "Refusing deployment cleanup outside the expected target: $TargetDir"
          }

          [System.IO.Directory]::CreateDirectory($TargetDir) | Out-Null

          $ExtractedPath = [System.IO.Path]::GetFullPath(
              (Join-Path -Path $TargetDir -ChildPath 'AFKI-EOR')
          )
          $TargetPrefix = $TargetDir.TrimEnd('\') + '\'
          if (-not $ExtractedPath.StartsWith(
              $TargetPrefix,
              [System.StringComparison]::OrdinalIgnoreCase
          )) {
              throw "Refusing extracted-directory cleanup outside target: $ExtractedPath"
          }
          if (Test-Path -LiteralPath $ExtractedPath) {
              Remove-Item -LiteralPath $ExtractedPath -Recurse -Force
              Write-Output "Removed previous extracted directory: $ExtractedPath"
          }

          $Archives = @(
              Get-ChildItem -LiteralPath $TargetDir -File -Filter 'AFKI-EOR-*.zip'
          )
          foreach ($Archive in $Archives) {
              Remove-Item -LiteralPath $Archive.FullName -Force
              Write-Output "Removed previous package: $($Archive.FullName)"
          }
          Write-Output "Deployment target cleanup completed. Archives removed: $($Archives.Count)"
          """.replace("__REMOTE_WINDOWS_DIR__", remote_windows_dir)

              print(f"Cleaning previous deployment from: {remote_windows_dir}")
              run_powershell(client, cleanup_script)

              sftp = client.open_sftp()
              target_path = posixpath.join(
                  remote_dir,
                  package_path.name,
              )

              print(f"Uploading package to: {target_path}")
              sftp.put(str(package_path), target_path)
              sftp.close()

              remote_archive = (
                  remote_windows_dir + "\\" + package_path.name
              )
              print(f"Extracting package in: {remote_windows_dir}")
              run_powershell(
                  client,
                  "$ErrorActionPreference = 'Stop'; "
                  f"Expand-Archive -LiteralPath '{remote_archive}' "
                  f"-DestinationPath '{remote_windows_dir}' -Force",
              )

              print("Package uploaded and extracted successfully.")
          finally:
              client.close()
          '@ | Set-Content -Path "$env:RUNNER_TEMP\upload_package.py"

          python "$env:RUNNER_TEMP\upload_package.py"

